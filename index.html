<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000" id="theme-color-meta">
<meta name="description" content="Digital Tasbih with themes, language and history">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Digital Tasbih</title>
<style>
:root{--bg:#f4f0eb;--bg2:#fffaf3;--text:#142744;--muted:#647084;--accent:#c58a25;--panel:rgba(255,255,255,.48);--panel2:rgba(255,255,255,.25);--border:rgba(255,255,255,.82);--shadow:rgba(31,42,60,.16);--track:rgba(20,39,68,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;color:var(--text);font-family:system-ui,"Noto Sans Bengali",sans-serif;background:radial-gradient(ellipse at 8% 8%,rgba(255,255,255,.95),transparent 34%),radial-gradient(ellipse at 90% 88%,rgba(242,198,109,.24),transparent 32%),linear-gradient(145deg,var(--bg2),var(--bg));transition:background .25s,color .25s}
body[data-theme="Night"]{--bg:#050505;--bg2:#111;--text:#f5f5f5;--muted:#aaa;--accent:#d8bd78;--panel:rgba(255,255,255,.09);--panel2:rgba(255,255,255,.045);--border:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.4);--track:rgba(255,255,255,.16);background:radial-gradient(ellipse at 12% 5%,rgba(255,255,255,.08),transparent 34%),#050505}
body[data-theme="Ember"]{--bg:#160d08;--bg2:#24140d;--text:#fff3e8;--muted:#c0a99b;--accent:#e58b42;--panel:rgba(255,224,198,.09);--panel2:rgba(255,224,198,.04);--border:rgba(255,221,194,.22);--shadow:rgba(0,0,0,.42);--track:rgba(255,235,220,.15);background:linear-gradient(145deg,#24140d,#100906)}
body[data-theme="Slate"]{--bg:#101722;--bg2:#1b2736;--text:#edf3fb;--muted:#aab7c7;--accent:#8ba9d3;--panel:rgba(220,235,255,.09);--panel2:rgba(220,235,255,.04);--border:rgba(220,235,255,.22);--shadow:rgba(0,0,0,.4);--track:rgba(220,235,255,.15);background:linear-gradient(145deg,#1b2736,#0d141e)}
body[data-theme="Moss"]{--bg:#0c130b;--bg2:#172116;--text:#eff6e9;--muted:#aab8a2;--accent:#a5b875;--panel:rgba(225,245,210,.09);--panel2:rgba(225,245,210,.04);--border:rgba(225,245,210,.22);--shadow:rgba(0,0,0,.42);--track:rgba(225,245,210,.15);background:linear-gradient(145deg,#172116,#080d08)}
body[data-theme="Ocean"]{--bg:#06131d;--bg2:#0d2635;--text:#eaf7ff;--muted:#a3bfce;--accent:#53b7d6;--panel:rgba(210,245,255,.09);--panel2:rgba(210,245,255,.04);--border:rgba(210,245,255,.23);--shadow:rgba(0,0,0,.42);--track:rgba(210,245,255,.15);background:linear-gradient(145deg,#0d2635,#041019)}
main{width:min(100%,430px);text-align:center;position:relative}
.page{display:none}.page.active{display:block}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.icon-btn{width:44px;height:44px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;color:var(--accent);background:linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 18px var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.dome{width:58px;height:48px;color:var(--accent);display:grid;place-items:center}.dome svg{width:54px;height:46px;stroke:currentColor;fill:none;stroke-width:1.7}
.count{font-size:clamp(66px,19vw,96px);line-height:1.08;font-weight:650;font-variant-numeric:tabular-nums;margin:12px 0 18px}
.ring-wrap{width:min(68vw,260px);height:min(68vw,260px);margin:0 auto;position:relative;display:grid;place-items:center}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-track{fill:none;stroke:var(--track);stroke-width:7}.ring-progress{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:628.32;stroke-dashoffset:628.32}
.tap{width:calc(100% - 24px);height:calc(100% - 24px);border-radius:50%;border:1px solid var(--border);background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.28),transparent 44%),linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:inset 0 1px 2px rgba(255,255,255,.35),inset 0 -12px 28px var(--shadow),0 12px 32px var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
.tap:active{transform:scale(.975)}.beads{width:36px;height:42px;color:var(--accent);margin-bottom:3px}.tap-label{font-family:Georgia,serif;font-size:30px;letter-spacing:2px}.tap-sub{font-size:16px;color:var(--accent)}
.summary{margin:20px auto 0;width:min(100%,360px);border:1px solid var(--border);border-radius:40px;padding:10px 12px;background:linear-gradient(115deg,var(--panel),var(--panel2));box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 8px 22px var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;justify-content:center;gap:14px;align-items:center;font-size:15px}
.summary .sep{height:23px;width:1px;background:var(--border)}.summary b{color:var(--accent)}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.target,.custom-open,.action,.custom-row button,.secondary-btn{border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:inset 0 1px 1px rgba(255,255,255,.22),0 5px 14px var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--text);padding:12px 4px;font-size:15px;cursor:pointer}
.target.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px var(--shadow)}
.custom-open{width:100%;margin-top:8px;padding:10px}.custom-row{display:none;gap:8px;margin-top:8px}.custom-row.show{display:flex}
.custom-row input{min-width:0;flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:13px;padding:10px 12px;color:var(--text);font:inherit}
.custom-row button{padding:10px 14px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:18px}.action{padding:13px 4px;font-size:15px}.hint{color:var(--muted);font-size:12px;margin-top:22px}
.settings-head{display:flex;align-items:center;gap:14px;margin:12px 0 22px}.settings-head h2{font-size:23px;font-weight:500;margin:0;flex:1;text-align:center;padding-right:44px}
.section-label{text-align:left;font-size:18px;font-weight:500;margin:24px 0 12px}
.theme-list{padding:8px 18px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:0 10px 28px var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:left}
.theme-option{width:100%;display:flex;align-items:center;gap:14px;padding:14px 2px;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;text-align:left;cursor:pointer}
.theme-option .swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(128,128,128,.35);flex:none}.check{margin-left:auto;font-size:22px;opacity:0}.selected .check{opacity:1}.selected{font-weight:600}
.history-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
.history-tab{padding:10px 3px;border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--text);font:inherit;font-size:13px}
.history-tab.active{border-color:var(--accent);color:var(--accent)}
.history-card{padding:13px 14px;margin:9px 0;border:1px solid var(--border);border-radius:17px;background:linear-gradient(145deg,var(--panel),var(--panel2));text-align:left;box-shadow:0 5px 14px var(--shadow)}
.history-card strong{color:var(--accent)}.history-meta{color:var(--muted);font-size:12px;margin-top:5px}
.history-empty{color:var(--muted);padding:28px 8px}
.history-list{max-height:48vh;overflow:auto;text-align:left}
.history-actions{display:flex;gap:8px;margin-top:12px}.history-actions button{flex:1}
.danger{color:#e98282}
@media(max-width:360px){.ring-wrap{width:220px;height:220px}.summary{font-size:13px;gap:9px}.target{font-size:13px}}
</style>
</head>
<body data-theme="Night">
<main>
<section id="homePage" class="page active">
 <div class="top">
  <button class="icon-btn" id="historyBtn" aria-label="History" title="History">
   <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
  </button>
  <div class="dome" aria-hidden="true"><svg viewBox="0 0 60 50"><path d="M7 43c2-13 10-21 23-27 13 6 21 14 23 27M7 43h46M16 42c1-9 6-16 14-21 8 5 13 12 14 21M30 16V5m-3 4c2 2 4 2 6 0"/></svg></div>
  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
   <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.6 2.8-.2-.1a1.7 1.7 0 0 0-1.8.1 1.7 1.7 0 0 0-.8 1.5v.2h-3.2v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8-.1l-.2.1-1.6-2.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-.9H6.3v-3.2h.2A1.7 1.7 0 0 0 8 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.6-2.8.2.1a1.7 1.7 0 0 0 1.8-.1 1.7 1.7 0 0 0 .8-1.5v-.2h3.2v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8.1l.2-.1 1.6 2.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5.9h.2v3.2h-.2a1.7 1.7 0 0 0-1.5.9z"/></svg>
  </button>
 </div>
 <div class="count" id="count">০</div>
 <div class="ring-wrap">
  <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true"><circle class="ring-track" cx="110" cy="110" r="100"/><circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"/></svg>
  <button class="tap" id="tap" aria-label="Count">
   <svg class="beads" viewBox="0 0 40 48" aria-hidden="true"><g fill="currentColor"><circle cx="20" cy="7" r="3.5"/><circle cx="29" cy="10" r="3.5"/><circle cx="34" cy="19" r="3.5"/><circle cx="32" cy="29" r="3.5"/><circle cx="25" cy="36" r="3.5"/><circle cx="15" cy="36" r="3.5"/><circle cx="8" cy="29" r="3.5"/><circle cx="6" cy="19" r="3.5"/><circle cx="11" cy="10" r="3.5"/><path d="M20 39v5l-3 2 3 2 3-2-3-2"/></g></svg>
   <span class="tap-label">TAP</span><span class="tap-sub" id="tapSub">+১</span>
  </button>
 </div>
 <div class="summary"><span><span id="targetLabel">টার্গেট:</span> <b id="goalText">৩৩</b></span><span class="sep"></span><span><span id="remainingLabel">বাকি:</span> <b id="remaining">৩৩</b></span></div>
 <div class="targets">
  <button class="target" data-goal="33">৩৩</button><button class="target" data-goal="99">৯৯</button><button class="target" data-goal="100">১০০</button><button class="target" data-goal="1000">১,০০০</button>
 </div>
 <button class="custom-open" id="customToggle">＋ কাস্টম টার্গেট</button>
 <div class="custom-row" id="customRow"><input id="customInput" type="number" min="1" max="10000000" inputmode="numeric" placeholder="নিজের টার্গেট লিখুন"><button id="customApply">Apply</button></div>
 <div class="actions"><button class="action" id="undo">↶ Undo</button><button class="action" id="minus">− ১</button><button class="action" id="reset">↻ Reset</button></div>
 <div class="hint" id="hint">কাউন্টার স্বয়ংক্রিয়ভাবে সংরক্ষিত হবে</div>
</section>
<section id="settingsPage" class="page">
 <div class="settings-head"><button class="icon-btn" id="settingsBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><h2 id="settingsTitle">Settings</h2></div>
 <h3 class="section-label" id="themeHeading">Theme</h3>
 <div class="theme-list">
  <button class="theme-option" data-theme-choice="Night"><span class="swatch" style="background:#000"></span><span>Night</span><span class="check">✓</span></button>
  <button class="theme-option" data-theme-choice="Ember"><span class="swatch" style="background:#160d08"></span><span>Ember</span><span class="check">✓</span></button>
  <button class="theme-option" data-theme-choice="Slate"><span class="swatch" style="background:#101722"></span><span>Slate</span><span class="check">✓</span></button>
  <button class="theme-option" data-theme-choice="Moss"><span class="swatch" style="background:#0c130b"></span><span>Moss</span><span class="check">✓</span></button>
  <button class="theme-option" data-theme-choice="Ocean"><span class="swatch" style="background:#06131d"></span><span>Ocean</span><span class="check">✓</span></button>
 </div>
 <h3 class="section-label" id="languageHeading">Language</h3>
 <div class="theme-list">
  <button class="theme-option" data-language-choice="bn"><span>🇧🇩</span><span>বাংলা</span><span class="check">✓</span></button>
  <button class="theme-option" data-language-choice="en"><span>🇬🇧</span><span>English</span><span class="check">✓</span></button>
 </div>
</section>
<section id="historyPage" class="page">
 <div class="settings-head"><button class="icon-btn" id="historyBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><h2 id="historyTitle">History</h2></div>
 <div class="history-tabs">
  <button class="history-tab active" data-history-tab="daily" id="tabDaily">Daily</button>
  <button class="history-tab" data-history-tab="sessions" id="tabSessions">Sessions</button>
  <button class="history-tab" data-history-tab="taps" id="tabTaps">Taps</button>
 </div>
 <div id="historySummary"></div>
 <div class="history-list" id="historyList"></div>
 <div class="history-actions"><button class="secondary-btn" id="exportHistory">Export</button><button class="secondary-btn danger" id="clearHistory">Clear History</button></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const translations={
bn:{target:'টার্গেট:',remaining:'বাকি:',custom:'＋ কাস্টম টার্গেট',placeholder:'নিজের টার্গেট লিখুন',apply:'প্রয়োগ',undo:'↶ Undo',minus:'− ১',reset:'↻ Reset',hint:'কাউন্টার স্বয়ংক্রিয়ভাবে সংরক্ষিত হবে',confirm:'গণনা শূন্য করবেন?',invalid:'১ থেকে ১,০০,০০,০০০-এর মধ্যে একটি সঠিক সংখ্যা লিখুন।',tap:'+১',settings:'সেটিংস',theme:'থিম',language:'ভাষা',back:'ফিরে যান',history:'ইতিহাস',daily:'দৈনিক',sessions:'সেশন',taps:'ট্যাপ',total:'মোট গণনা',records:'টি রেকর্ড',empty:'এখনো কোনো History নেই।',clear:'সব History মুছে ফেলবেন?',export:'ডাউনলোড',clearBtn:'History মুছুন',completed:'টার্গেট পূরণ',count:'গণনা',date:'তারিখ',time:'সময়',noSessions:'এখনো কোনো সেশন সম্পন্ন হয়নি।',noTaps:'এখনো কোনো Tap History নেই।'},
en:{target:'Target:',remaining:'Remaining:',custom:'＋ Custom Target',placeholder:'Enter your target',apply:'Apply',undo:'↶ Undo',minus:'− 1',reset:'↻ Reset',hint:'Counter is saved automatically',confirm:'Reset the count to zero?',invalid:'Enter a valid number between 1 and 10,000,000.',tap:'+1',settings:'Settings',theme:'Theme',language:'Language',back:'Back',history:'History',daily:'Daily',sessions:'Sessions',taps:'Taps',total:'Total count',records:'records',empty:'No history yet.',clear:'Delete all history?',export:'Export',clearBtn:'Clear History',completed:'Target completed',count:'Count',date:'Date',time:'Time',noSessions:'No completed sessions yet.',noTaps:'No tap history yet.'}
};
const themes=['Night','Ember','Slate','Moss','Ocean'], circumference=2*Math.PI*100;
let count=readNum('tasbih-count',0),goal=readNum('tasbih-goal',33)||33;
let theme=localStorage.getItem('tasbih-theme')||'Night',language=localStorage.getItem('tasbih-language')||'bn';
let undoStack=[],tapHistory=readJSON('tasbih-tap-history',[]),sessions=readJSON('tasbih-sessions',[]),activeTab='daily';
function readNum(k,d){let n=Number(localStorage.getItem(k));return Number.isFinite(n)&&n>=0?n:d}
function readJSON(k,d){try{let x=JSON.parse(localStorage.getItem(k));return Array.isArray(x)?x:d}catch(e){return d}}
function t(){return translations[language]||translations.bn}
function fmt(n){return Math.floor(n).toLocaleString(language==='bn'?'bn-BD':'en-US')}
function dateKey(ts){let d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateText(ts){return new Date(ts).toLocaleDateString(language==='bn'?'bn-BD':'en-US',{year:'numeric',month:'short',day:'numeric'})}
function timeText(ts){return new Date(ts).toLocaleTimeString(language==='bn'?'bn-BD':'en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function save(){localStorage.setItem('tasbih-count',String(count));localStorage.setItem('tasbih-goal',String(goal));localStorage.setItem('tasbih-theme',theme);localStorage.setItem('tasbih-language',language);localStorage.setItem('tasbih-tap-history',JSON.stringify(tapHistory));localStorage.setItem('tasbih-sessions',JSON.stringify(sessions))}
function render(){
 $('count').textContent=fmt(count);$('goalText').textContent=fmt(goal);$('remaining').textContent=fmt(Math.max(0,goal-count));
 let p=Math.min(1,count/goal);$('ringProgress').style.strokeDasharray=String(circumference);$('ringProgress').style.strokeDashoffset=String(circumference*(1-p));
 document.querySelectorAll('.target').forEach(b=>{b.textContent=fmt(Number(b.dataset.goal));b.classList.toggle('active',Number(b.dataset.goal)===goal)});
 document.querySelectorAll('[data-theme-choice]').forEach(b=>b.classList.toggle('selected',b.dataset.themeChoice===theme));
 document.querySelectorAll('[data-language-choice]').forEach(b=>b.classList.toggle('selected',b.dataset.languageChoice===language));
 save();
}
function applyTheme(v){theme=themes.includes(v)?v:'Night';document.body.dataset.theme=theme;$('theme-color-meta').content=theme==='Night'?'#000000':'#101722';render()}
function updateLanguage(){
 let x=t();document.documentElement.lang=language;
 $('targetLabel').textContent=x.target;$('remainingLabel').textContent=x.remaining;$('customToggle').textContent=x.custom;$('customInput').placeholder=x.placeholder;$('customApply').textContent=x.apply;$('undo').textContent=x.undo;$('minus').textContent=x.minus;$('reset').textContent=x.reset;$('hint').textContent=x.hint;$('tapSub').textContent=x.tap;
 $('settingsTitle').textContent=x.settings;$('themeHeading').textContent=x.theme;$('languageHeading').textContent=x.language;$('historyTitle').textContent=x.history;$('tabDaily').textContent=x.daily;$('tabSessions').textContent=x.sessions;$('tabTaps').textContent=x.taps;$('exportHistory').textContent=x.export;$('clearHistory').textContent=x.clearBtn;
 render();if($('historyPage').classList.contains('active'))renderHistory();
}
function showPage(id){['homePage','settingsPage','historyPage'].forEach(p=>$(p).classList.toggle('active',p===id));if(id==='historyPage')renderHistory()}
function vibrate(){if(navigator.vibrate)navigator.vibrate(22)}
function addTap(){
 let now=Date.now(),before=count;undoStack.push(before);count++;
 tapHistory.unshift({ts:now,count:count,goal:goal});
 if(tapHistory.length>5000)tapHistory.length=5000;
 if(before<goal&&count>=goal){sessions.unshift({ts:now,goal:goal,count:count});if(sessions.length>1000)sessions.length=1000}
 render();vibrate();
}
$('tap').addEventListener('click',addTap);
$('undo').addEventListener('click',()=>{if(!undoStack.length)return;let old=undoStack.pop();count=old;tapHistory.shift();render()});
$('minus').addEventListener('click',()=>{count=Math.max(0,count-1);render()});
$('reset').addEventListener('click',()=>{if(confirm(t().confirm)){count=0;undoStack=[];render()}});
document.querySelectorAll('.target').forEach(b=>b.addEventListener('click',()=>{goal=Number(b.dataset.goal);render()}));
$('customToggle').addEventListener('click',()=>{$('customRow').classList.toggle('show');if($('customRow').classList.contains('show'))$('customInput').focus()});
$('customApply').addEventListener('click',()=>{let n=Number($('customInput').value);if(!Number.isSafeInteger(n)||n<1||n>10000000){alert(t().invalid);return}goal=n;render();$('customRow').classList.remove('show')});
$('customInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('customApply').click()});
$('settingsBtn').addEventListener('click',()=>showPage('settingsPage'));
$('settingsBack').addEventListener('click',()=>showPage('homePage'));
$('historyBtn').addEventListener('click',()=>showPage('historyPage'));
$('historyBack').addEventListener('click',()=>showPage('homePage'));
document.querySelectorAll('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>applyTheme(b.dataset.themeChoice)));
document.querySelectorAll('[data-language-choice]').forEach(b=>b.addEventListener('click',()=>{language=b.dataset.languageChoice;updateLanguage()}));
document.querySelectorAll('[data-history-tab]').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.historyTab;document.querySelectorAll('[data-history-tab]').forEach(x=>x.classList.toggle('active',x===b));renderHistory()}));
function card(title,sub){return '<div class="history-card"><strong>'+title+'</strong><div class="history-meta">'+sub+'</div></div>'}
function renderHistory(){
 let x=t(),list=$('historyList'),summary=$('historySummary');list.innerHTML='';summary.innerHTML='';
 if(activeTab==='daily'){
  let days={};tapHistory.forEach(r=>{let k=dateKey(r.ts);days[k]=(days[k]||0)+1});
  let keys=Object.keys(days).sort().reverse();
  let total=tapHistory.length;
  summary.innerHTML=card(x.total+': '+fmt(total),fmt(keys.length)+' '+x.records);
  if(!keys.length){list.innerHTML='<div class="history-empty">'+x.empty+'</div>';return}
  keys.forEach(k=>{let d=new Date(k+'T00:00:00').getTime();list.innerHTML+=card(dateText(d)+' — '+fmt(days[k]),x.count+': '+fmt(days[k]))});
 }else if(activeTab==='sessions'){
  summary.innerHTML=card(x.sessions+': '+fmt(sessions.length),x.completed);
  if(!sessions.length){list.innerHTML='<div class="history-empty">'+x.noSessions+'</div>';return}
  sessions.forEach(r=>{list.innerHTML+=card(x.completed+' — '+fmt(r.goal),dateText(r.ts)+' · '+timeText(r.ts)+' · '+x.count+': '+fmt(r.count))});
 }else{
  summary.innerHTML=card(x.taps+': '+fmt(tapHistory.length),x.records);
  if(!tapHistory.length){list.innerHTML='<div class="history-empty">'+x.noTaps+'</div>';return}
  tapHistory.slice(0,300).forEach(r=>{list.innerHTML+=card(x.count+': '+fmt(r.count),dateText(r.ts)+' · '+timeText(r.ts)+' · '+x.target+' '+fmt(r.goal))});
  if(tapHistory.length>300)list.innerHTML+='<div class="history-empty">Showing latest 300 taps</div>';
 }
}
$('clearHistory').addEventListener('click',()=>{if(confirm(t().clear)){tapHistory=[];sessions=[];save();renderHistory()}});
$('exportHistory').addEventListener('click',()=>{
 let data={exportedAt:new Date().toISOString(),tapHistory:tapHistory,sessions:sessions};
 let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='tasbih-history.json';a.click();URL.revokeObjectURL(url);
});
if(!themes.includes(theme))theme='Night';if(!['bn','en'].includes(language))language='bn';
applyTheme(theme);updateLanguage();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}))}
</script>
</body>
</html>
