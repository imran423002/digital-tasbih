<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta id="theme-color-meta" name="theme-color" content="#000000">
<meta name="description" content="Digital Tasbih counter with themes, languages and custom targets">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Digital Tasbih</title>

<style>
:root{
  --bg:#f4f0eb;--bg2:#fffaf3;--text:#142744;--muted:#647084;
  --accent:#c58a25;--accent2:#f2c66d;--panel:rgba(255,255,255,.48);
  --panel2:rgba(255,255,255,.25);--border:rgba(255,255,255,.82);
  --shadow:rgba(31,42,60,.16);--track:rgba(20,39,68,.12);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100dvh;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:center;color:var(--text);
  font-family:system-ui,"Noto Sans Bengali",sans-serif;
  background:
    radial-gradient(ellipse at 8% 8%,rgba(255,255,255,.95),transparent 34%),
    radial-gradient(ellipse at 90% 88%,rgba(242,198,109,.24),transparent 32%),
    linear-gradient(145deg,var(--bg2),var(--bg));
  transition:background .25s,color .25s;
}
body[data-theme="Night"]{
  --bg:#050505;--bg2:#111;--text:#f5f5f5;--muted:#aaa;--accent:#d8bd78;--accent2:#f1d99a;
  --panel:rgba(255,255,255,.09);--panel2:rgba(255,255,255,.045);--border:rgba(255,255,255,.22);
  --shadow:rgba(0,0,0,.4);--track:rgba(255,255,255,.16);
  background:radial-gradient(ellipse at 12% 5%,rgba(255,255,255,.08),transparent 34%),#050505;
}
body[data-theme="Ember"]{
  --bg:#160d08;--bg2:#24140d;--text:#fff3e8;--muted:#c0a99b;--accent:#e58b42;--accent2:#ffc184;
  --panel:rgba(255,224,198,.09);--panel2:rgba(255,224,198,.04);--border:rgba(255,221,194,.22);
  --shadow:rgba(0,0,0,.42);--track:rgba(255,235,220,.15);
  background:radial-gradient(ellipse at 15% 8%,rgba(231,137,68,.13),transparent 36%),linear-gradient(145deg,#24140d,#100906);
}
body[data-theme="Slate"]{
  --bg:#101722;--bg2:#1b2736;--text:#edf3fb;--muted:#aab7c7;--accent:#8ba9d3;--accent2:#c5d8f1;
  --panel:rgba(220,235,255,.09);--panel2:rgba(220,235,255,.04);--border:rgba(220,235,255,.22);
  --shadow:rgba(0,0,0,.4);--track:rgba(220,235,255,.15);
  background:radial-gradient(ellipse at 12% 5%,rgba(140,175,220,.15),transparent 35%),linear-gradient(145deg,#1b2736,#0d141e);
}
body[data-theme="Moss"]{
  --bg:#0c130b;--bg2:#172116;--text:#eff6e9;--muted:#aab8a2;--accent:#a5b875;--accent2:#d1e2a4;
  --panel:rgba(225,245,210,.09);--panel2:rgba(225,245,210,.04);--border:rgba(225,245,210,.22);
  --shadow:rgba(0,0,0,.42);--track:rgba(225,245,210,.15);
  background:radial-gradient(ellipse at 12% 5%,rgba(165,190,110,.13),transparent 35%),linear-gradient(145deg,#172116,#080d08);
}
body[data-theme="Ocean"]{
  --bg:#06131d;--bg2:#0d2635;--text:#eaf7ff;--muted:#a3bfce;--accent:#53b7d6;--accent2:#a0e4f4;
  --panel:rgba(210,245,255,.09);--panel2:rgba(210,245,255,.04);--border:rgba(210,245,255,.23);
  --shadow:rgba(0,0,0,.42);--track:rgba(210,245,255,.15);
  background:radial-gradient(ellipse at 12% 5%,rgba(70,180,220,.15),transparent 35%),linear-gradient(145deg,#0d2635,#041019);
}
main{width:min(100%,430px);text-align:center;position:relative}
.top{height:54px;display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px}
.icon-btn{
 width:44px;height:44px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;
 color:var(--accent);background:linear-gradient(145deg,var(--panel),var(--panel2));
 box-shadow:inset 0 1px 1px rgba(255,255,255,.35),0 6px 18px var(--shadow);
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer
}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.dome{width:58px;height:48px;color:var(--accent);display:grid;place-items:center}
.dome svg{width:54px;height:46px;stroke:currentColor;fill:none;stroke-width:1.7}
.count{font-size:clamp(66px,19vw,96px);line-height:1.08;font-weight:650;font-variant-numeric:tabular-nums;margin:12px 0 18px;color:var(--text)}
.ring-wrap{width:min(68vw,260px);height:min(68vw,260px);margin:0 auto;position:relative;display:grid;place-items:center}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-track{fill:none;stroke:var(--track);stroke-width:7}
.ring-progress{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;stroke-dasharray:628.32;stroke-dashoffset:628.32;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--accent) 55%,transparent))}
.tap{
 width:calc(100% - 24px);height:calc(100% - 24px);border-radius:50%;border:1px solid var(--border);
 background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.28),transparent 44%),linear-gradient(145deg,var(--panel),var(--panel2));
 box-shadow:inset 0 1px 2px rgba(255,255,255,.35),inset 0 -12px 28px var(--shadow),0 12px 32px var(--shadow);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--text);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
 touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer
}
.tap:active{transform:scale(.975)}
.beads{width:36px;height:42px;color:var(--accent);margin-bottom:3px}
.tap-label{font-family:Georgia,serif;font-size:30px;letter-spacing:2px}
.tap-sub{font-size:16px;color:var(--accent)}
.summary{
 margin:20px auto 0;width:min(100%,360px);border:1px solid var(--border);border-radius:40px;padding:10px 12px;
 background:linear-gradient(115deg,var(--panel),var(--panel2));box-shadow:inset 0 1px 1px rgba(255,255,255,.28),0 8px 22px var(--shadow);
 backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
 display:flex;justify-content:center;gap:14px;align-items:center;font-size:15px
}
.summary .sep{height:23px;width:1px;background:var(--border)}
.summary b{color:var(--accent)}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.target,.custom-open,.action,.custom-row button{
 border:1px solid var(--border);border-radius:16px;background:linear-gradient(145deg,var(--panel),var(--panel2));
 box-shadow:inset 0 1px 1px rgba(255,255,255,.22),0 5px 14px var(--shadow);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--text);padding:12px 4px;font-size:15px;cursor:pointer
}
.target.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 24%,transparent)}
.custom-open{width:100%;margin-top:8px;padding:10px}
.custom-row{display:none;gap:8px;margin-top:8px}
.custom-row.show{display:flex}
.custom-row input{min-width:0;flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:13px;padding:10px 12px;color:var(--text);font:inherit}
.custom-row button{padding:10px 14px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:18px}
.action{padding:13px 4px;font-size:15px}
.hint{color:var(--muted);font-size:12px;margin-top:22px}
.page{display:none}
.page.active{display:block}
.settings-head{display:flex;align-items:center;gap:14px;margin:12px 0 22px}
.settings-head h2{font-size:23px;font-weight:500;margin:0;flex:1;text-align:center;padding-right:44px}
.theme-list{padding:8px 18px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(145deg,var(--panel),var(--panel2));box-shadow:0 10px 28px var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);text-align:left}
.theme-option{width:100%;display:flex;align-items:center;gap:14px;padding:16px 2px;border:0;background:transparent;color:var(--text);font:inherit;font-size:17px;text-align:left;cursor:pointer}
.theme-option .swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(128,128,128,.35);flex:none}
.theme-option .check{margin-left:auto;font-size:22px;opacity:0}
.theme-option.selected .check{opacity:1}
.theme-option.selected{font-weight:600}
.section-label{font-size:18px;font-weight:500;margin:25px 0 12px;text-align:left}
@media(max-width:360px){
 .ring-wrap{width:220px;height:220px}
 .summary{font-size:13px;gap:9px}
 .target{font-size:13px}
}
</style>
</head>

<body data-theme="Night">
<main>

<section id="homePage" class="page active">

 <div class="top">
  <button class="icon-btn" id="statsBtn" aria-label="Statistics">
   <svg viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-7M22 19V3"/></svg>
  </button>

  <div class="dome" aria-hidden="true">
   <svg viewBox="0 0 60 50"><path d="M7 43c2-13 10-21 23-27 13 6 21 14 23 27M7 43h46M16 42c1-9 6-16 14-21 8 5 13 12 14 21M30 16V5m-3 4c2 2 4 2 6 0"/></svg>
  </div>

  <button class="icon-btn" id="settingsBtn" aria-label="Settings">
   <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.6 2.8-.2-.1a1.7 1.7 0 0 0-1.8.1 1.7 1.7 0 0 0-.8 1.5v.2h-3.2v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8-.1l-.2.1-1.6-2.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-.9H6.3v-3.2h.2A1.7 1.7 0 0 0 8 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.6-2.8.2.1a1.7 1.7 0 0 0 1.8-.1 1.7 1.7 0 0 0 .8-1.5v-.2h3.2v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8.1l.2-.1 1.6 2.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5.9h.2v3.2h-.2a1.7 1.7 0 0 0-1.5.9z"/></svg>
  </button>
 </div>

 <div class="count" id="count">০</div>

 <div class="ring-wrap">
  <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
   <circle class="ring-track" cx="110" cy="110" r="100"/>
   <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"/>
  </svg>

  <button class="tap" id="tap" aria-label="Count">
   <svg class="beads" viewBox="0 0 40 48" aria-hidden="true">
    <g fill="currentColor">
     <circle cx="20" cy="7" r="3.5"/>
     <circle cx="29" cy="10" r="3.5"/>
     <circle cx="34" cy="19" r="3.5"/>
     <circle cx="32" cy="29" r="3.5"/>
     <circle cx="25" cy="36" r="3.5"/>
     <circle cx="15" cy="36" r="3.5"/>
     <circle cx="8" cy="29" r="3.5"/>
     <circle cx="6" cy="19" r="3.5"/>
     <circle cx="11" cy="10" r="3.5"/>
     <path d="M20 39v5l-3 2 3 2 3-2-3-2"/>
    </g>
   </svg>
   <span class="tap-label">TAP</span>
   <span class="tap-sub" id="tapSub">+১</span>
  </button>
 </div>

 <div class="summary">
  <span><span id="targetLabel">টার্গেট:</span> <b id="goalText">৩৩</b></span>
  <span class="sep"></span>
  <span><span id="remainingLabel">বাকি:</span> <b id="remaining">৩৩</b></span>
 </div>

 <div class="targets">
  <button class="target active" data-goal="33">৩৩</button>
  <button class="target" data-goal="99">৯৯</button>
  <button class="target" data-goal="100">১০০</button>
  <button class="target" data-goal="1000">১,০০০</button>
 </div>

 <button class="custom-open" id="customToggle">＋ কাস্টম টার্গেট</button>

 <div class="custom-row" id="customRow">
  <input id="customInput" type="number" min="1" max="10000000" inputmode="numeric" placeholder="নিজের টার্গেট লিখুন">
  <button id="customApply">Apply</button>
 </div>

 <div class="actions">
  <button class="action" id="undo">↶ Undo</button>
  <button class="action" id="minus">− ১</button>
  <button class="action" id="reset">↻ Reset</button>
 </div>

 <div class="hint" id="hint">কাউন্টার স্বয়ংক্রিয়ভাবে সংরক্ষিত হবে</div>
</section>

<section id="settingsPage" class="page">

 <div class="settings-head">
  <button class="icon-btn" id="backBtn" aria-label="Back">
   <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <h2 id="settingsTitle">Theme</h2>
 </div>

 <h3 class="section-label" id="themeHeading">Theme</h3>

 <div class="theme-list" id="themeList">
  <button class="theme-option" data-theme-choice="Night">
   <span class="swatch" style="background:#000"></span>
   <span>Night</span><span class="check">✓</span>
  </button>
  <button class="theme-option" data-theme-choice="Ember">
   <span class="swatch" style="background:#160d08"></span>
   <span>Ember</span><span class="check">✓</span>
  </button>
  <button class="theme-option" data-theme-choice="Slate">
   <span class="swatch" style="background:#101722"></span>
   <span>Slate</span><span class="check">✓</span>
  </button>
  <button class="theme-option" data-theme-choice="Moss">
   <span class="swatch" style="background:#0c130b"></span>
   <span>Moss</span><span class="check">✓</span>
  </button>
  <button class="theme-option" data-theme-choice="Ocean">
   <span class="swatch" style="background:#06131d"></span>
   <span>Ocean</span><span class="check">✓</span>
  </button>
 </div>

 <h3 class="section-label" id="languageHeading">Language</h3>

 <div class="theme-list" id="languageList">
  <button class="theme-option" data-language-choice="bn">
   <span>🇧🇩</span>
   <span>বাংলা</span>
   <span class="check">✓</span>
  </button>
  <button class="theme-option" data-language-choice="en">
   <span>🇬🇧</span>
   <span>English</span>
   <span class="check">✓</span>
  </button>
 </div>

</section>
</main>

<script>
const $=id=>document.getElementById(id);

const safeNumber=(value,fallback)=>{
 const n=Number(value);
 return Number.isFinite(n)&&n>=0?n:fallback;
};

let count=safeNumber(localStorage.getItem('tasbih-count'),0);
let goal=safeNumber(localStorage.getItem('tasbih-goal'),33)||33;
let theme=localStorage.getItem('tasbih-theme')||'Night';
let language=localStorage.getItem('tasbih-language')||'bn';
let history=[];

const circumference=2*Math.PI*100;
const themes=['Night','Ember','Slate','Moss','Ocean'];

const translations={
 bn:{
  target:'টার্গেট:',
  remaining:'বাকি:',
  custom:'＋ কাস্টম টার্গেট',
  placeholder:'নিজের টার্গেট লিখুন',
  apply:'প্রয়োগ করুন',
  undo:'↶ Undo',
  minus:'− ১',
  reset:'↻ Reset',
  hint:'কাউন্টার স্বয়ংক্রিয়ভাবে সংরক্ষিত হবে',
  confirm:'গণনা শূন্য করবেন?',
  invalid:'১ থেকে ১,০০,০০,০০০-এর মধ্যে একটি সঠিক সংখ্যা লিখুন।',
  tap:'+১',
  theme:'থিম',
  language:'ভাষা',
  back:'ফিরে যান'
 },
 en:{
  target:'Target:',
  remaining:'Remaining:',
  custom:'＋ Custom Target',
  placeholder:'Enter your target',
  apply:'Apply',
  undo:'↶ Undo',
  minus:'− 1',
  reset:'↻ Reset',
  hint:'Counter is saved automatically',
  confirm:'Reset the count to zero?',
  invalid:'Enter a valid number between 1 and 10,000,000.',
  tap:'+1',
  theme:'Theme',
  language:'Language',
  back:'Back'
 }
};

function formatNumber(n){
 return Math.floor(n).toLocaleString(
  language==='bn'?'bn-BD':'en-US'
 );
}

function save(){
 localStorage.setItem('tasbih-count',String(count));
 localStorage.setItem('tasbih-goal',String(goal));
 localStorage.setItem('tasbih-theme',theme);
 localStorage.setItem('tasbih-language',language);
}

function render(){
 const t=translations[language];

 $('count').textContent=formatNumber(count);
 $('goalText').textContent=formatNumber(goal);
 $('remaining').textContent=formatNumber(Math.max(0,goal-count));

 const progress=Math.min(1,count/goal);

 $('ringProgress').style.strokeDasharray=String(circumference);
 $('ringProgress').style.strokeDashoffset=
  String(circumference*(1-progress));

 document.querySelectorAll('.target').forEach(b=>{
  b.textContent=formatNumber(Number(b.dataset.goal));
  b.classList.toggle(
   'active',
   Number(b.dataset.goal)===goal
  );
 });

 document.querySelectorAll('.theme-option[data-theme-choice]').forEach(b=>{
  b.classList.toggle(
   'selected',
   b.dataset.themeChoice===theme
  );
 });

 document.querySelectorAll('.theme-option[data-language-choice]').forEach(b=>{
  b.classList.toggle(
   'selected',
   b.dataset.languageChoice===language
  );
 });

 save();
}

function applyTheme(value){
 theme=themes.includes(value)?value:'Night';

 document.body.dataset.theme=theme;

 $('theme-color-meta').setAttribute(
  'content',
  theme==='Night'?'#000000':'#101722'
 );

 render();
}

function updateLanguage(){
 language=language==='en'?'en':'bn';

 const t=translations[language];

 document.documentElement.lang=language;

 $('targetLabel').textContent=t.target;
 $('remainingLabel').textContent=t.remaining;
 $('customToggle').textContent=t.custom;
 $('customInput').placeholder=t.placeholder;
 $('customApply').textContent=t.apply;
 $('undo').textContent=t.undo;
 $('minus').textContent=t.minus;
 $('reset').textContent=t.reset;
 $('hint').textContent=t.hint;
 $('tapSub').textContent=t.tap;
 $('settingsTitle').textContent=t.theme;
 $('themeHeading').textContent=t.theme;
 $('languageHeading').textContent=t.language;
 $('backBtn').setAttribute('aria-label',t.back);

 render();
}

function vibrate(){
 if(navigator.vibrate)navigator.vibrate(22);
}

/* TAP */
$('tap').addEventListener('click',()=>{
 history.push(count);
 count++;
 render();
 vibrate();
});

/* UNDO */
$('undo').addEventListener('click',()=>{
 if(history.length){
  count=history.pop();
 }else{
  count=Math.max(0,count-1);
 }
 render();
});

/* MINUS */
$('minus').addEventListener('click',()=>{
 count=Math.max(0,count-1);
 render();
});

/* RESET */
$('reset').addEventListener('click',()=>{
 if(confirm(translations[language].confirm)){
  history=[];
  count=0;
  render();
 }
});

/* PRESET TARGETS */
document.querySelectorAll('.target').forEach(b=>{
 b.addEventListener('click',()=>{
  goal=Number(b.dataset.goal);
  render();
 });
});

/* CUSTOM TARGET */
$('customToggle').addEventListener('click',()=>{
 $('customRow').classList.toggle('show');
 $('customInput').focus();
});

$('customApply').addEventListener('click',()=>{
 const n=Number($('customInput').value);

 if(!Number.isSafeInteger(n)||n<1||n>10000000){
  alert(translations[language].invalid);
  return;
 }

 goal=n;
 render();
 $('customRow').classList.remove('show');
});

$('customInput').addEventListener('keydown',e=>{
 if(e.key==='Enter'){
  $('customApply').click();
 }
});

/* SETTINGS PAGE */
$('settingsBtn').addEventListener('click',()=>{
 $('homePage').classList.remove('active');
 $('settingsPage').classList.add('active');
});

$('backBtn').addEventListener('click',()=>{
 $('settingsPage').classList.remove('active');
 $('homePage').classList.add('active');
});

/* THEME SELECTION */
document.querySelectorAll('[data-theme-choice]').forEach(b=>{
 b.addEventListener('click',()=>{
  applyTheme(b.dataset.themeChoice);
 });
});

/* LANGUAGE SELECTION */
document.querySelectorAll('[data-language-choice]').forEach(b=>{
 b.addEventListener('click',()=>{
  language=b.dataset.languageChoice;
  updateLanguage();
 });
});

/* LOAD SAVED SETTINGS */
applyTheme(theme);
updateLanguage();

/* SERVICE WORKER */
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
 });
}
</script>
</body>
</html>
